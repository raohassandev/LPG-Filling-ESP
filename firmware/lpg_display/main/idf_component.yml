## IDF Component Manager — managed dependencies
## Run `idf.py build` and these are fetched automatically.

dependencies:
  idf: ">=5.1.0"

  lvgl/lvgl:
    version: "^8.4.0"
    rules:
      - if: "idf_version >= 5.0"

  espressif/esp_lvgl_port:
    version: "^2.3.0"

  espressif/esp_lcd_touch_gt911:
    version: "^1.2.0"
